[package]
name = "jira_clone"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["db","gui", "jira_core"]

[workspace.dependencies]
# Shared ecosystem
tokio = {version = "1.52.3", features = ["full"]}
serde = {version = "1.0.228", features = ["derive"]}
anyhow = "1"
thiserror = "2"

# Database
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"]}
dotenvy = "0.15.7"

# GUI
iced = { version = "0.14.0", features = ["tokio"]}
