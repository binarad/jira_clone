[package]
name = "jira_clone"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["db", "gui", "jira_core"]
default-members = ["gui"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2"
# Shared ecosystem
tokio = { version = "1.52.3", features = ["full"] }

dotenvy = "0.15.7"
# Database
sqlx = { version = "0.9.0", features = ["chrono", "postgres", "runtime-tokio"] }

# GUI
iced = { version = "0.14.0", features = ["tokio"] }
